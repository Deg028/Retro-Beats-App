# The runner already has the Android SDK (ANDROID_HOME). Builds the Android APK on GitHub's machines, for free, while the EAS Free plan has no builds left.
# It runs `eas build --local`: the build happens here (no EAS build credit is used) and only the signing key is fetched
# from EAS with EXPO_TOKEN, so the APK installs over the one on the phone and keeps the person's data.
# Start it from the Actions tab («Run workflow»), or push a commit whose message has [apk] in it.
name: APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      # Only the app's own pictures: the old APKs in apk/ (about 100 MB each) would eat GitHub's 1 GB a month of LFS
      # downloads, and the old demo tracks are no longer used
      - name: Imágenes de la app (Git LFS)
        working-directory: .
        run: git lfs pull --include="mobile/**" --exclude="mobile/assets/audio/**"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Dependencias (aplica el parche de expo-audio)
        run: npm ci

      - name: Revisión de tipos y pruebas de letras
        run: |
          npx tsc --noEmit
          npm run test:lyrics

      # Says plainly, as an annotation of the run, whether the token is missing or Expo does not take it
      - name: Cuenta de Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::El secreto EXPO_TOKEN no llega: no existe o está vacío en Settings > Secrets and variables > Actions > Repository secrets"
            exit 1
          fi
          echo "::notice::EXPO_TOKEN llega con ${#EXPO_TOKEN} caracteres"
          who=$(npx eas-cli whoami 2>&1) || { echo "::error::Expo no aceptó el token: $(echo "$who" | tail -1)"; exit 1; }
          echo "::notice::Cuenta de Expo: $(echo "$who" | head -1)"

      - name: Compilar la APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # The project is the mobile/ folder as it is here, LFS pictures included
          EAS_NO_VCS: 1
          EAS_SKIP_AUTO_FINGERPRINT: 1
        run: npx eas-cli build --local --platform android --profile preview --non-interactive --output "$GITHUB_WORKSPACE/RetroBeats.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RetroBeats-apk
          path: RetroBeats.apk
          retention-days: 14
